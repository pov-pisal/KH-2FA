<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Edge-to-edge Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#bgGrad)" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="12"/>

  <!-- 'K' Vertical Bar (Bold & Expansive) -->
  <line x1="118" y1="92" x2="118" y2="420" stroke="url(#cyanGrad)" stroke-width="64" stroke-linecap="round"/>

  <!-- 'K' Upper Arm -->
  <line x1="128" y1="256" x2="250" y2="98" stroke="url(#cyanGrad)" stroke-width="64" stroke-linecap="round"/>

  <!-- 'K' Lower Arm -->
  <line x1="140" y1="250" x2="250" y2="414" stroke="url(#cyanGrad)" stroke-width="64" stroke-linecap="round"/>

  <!-- 'H' Crossbar -->
  <line x1="210" y1="256" x2="378" y2="256" stroke="#F8FAFC" stroke-width="64" stroke-linecap="round"/>

  <!-- 'H' Vertical Bar -->
  <line x1="378" y1="92" x2="378" y2="420" stroke="#F8FAFC" stroke-width="64" stroke-linecap="round"/>

  <!-- 2FA Verified Green Indicator Pip -->
  <circle cx="420" cy="92" r="50" fill="#0F172A"/>
  <circle cx="420" cy="92" r="38" fill="#10B981"/>
</svg>
